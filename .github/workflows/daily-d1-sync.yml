name: Daily D1 Backup Sync

on:
  schedule:
    # Run once daily at 02:00 AM VN time (19:00 UTC)
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run BKNS -> Cloudflare D1 Delta Sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9db1a9ece3ede791fd3cfb5d13bd6765
          CLOUDFLARE_D1_DATABASE_ID: 6cef0de8-cd16-4494-a809-d1d177be002e
          BKNS_API_URL: https://api-mstudio.minds.io.vn
          ADMIN_TOKEN: mstudio_ingest_secret_2026
        run: |
          node scripts/sync-bkns-to-d1.mjs
