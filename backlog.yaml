project:
  name: MStudio Channel
  cadence: 2-week-sprints
  cloudflare_mode: free-tier-first
  primary_web: nextjs
  human_final_review: true

owners:
  opencode: { role: frontend-product }
  commandcode: { role: backend-infrastructure }
  jules: { role: async-isolated-pr }
  human: { role: architecture-editorial-release-gate }

definition_of_done:
  - acceptance_passed
  - relevant_tests_passed
  - typecheck_passed
  - lint_passed
  - no_secrets
  - no_unrelated_diff
  - docs_updated_if_needed
  - quota_impact_reported
  - human_review_required

human_gates:
  schema:
    task: MST-004
    approved_by: human-lead
    approved_at: "2026-10-09"
  schema_and_evidence_semantics:
    task: MST-020
    approved_by: human-lead
    approved_at: "2026-10-09"
  editorial_ai:
    task: MST-031
    approved_by: human-lead
    approved_at: "2026-10-09"
  publishing:
    task: MST-041
    approved_by: human-lead
    approved_at: "2026-10-09"

# Bắt buộc: agent load các skills này qua skill tool trước khi làm task.
task_skills:
  MST-001: [nextjs-on-cloudflare, frontend-ui-engineering, vercel-react-best-practices]
  MST-002: [wrangler, workers-best-practices, cloudflare]
  MST-003: [documentation-and-adrs]
  MST-004: [workers-best-practices, api-and-interface-design, test-driven-development]
  MST-005: [frontend-ui-engineering, fixing-accessibility, ui-styling]
  MST-006: [api-and-interface-design, workers-best-practices, test-driven-development]
  MST-007: [workers-best-practices, wrangler, test-driven-development]
  MST-008: [workers-best-practices, test-driven-development]
  MST-009: [frontend-ui-engineering, fixing-accessibility]
  MST-010: [test-driven-development, debugging-and-error-recovery]
  MST-011: [observability-and-instrumentation, workers-best-practices]
  MST-012: [frontend-ui-engineering, fixing-accessibility, web-design-guidelines]
  MST-020: [api-and-interface-design, workers-best-practices, documentation-and-adrs]
  MST-021: [workers-best-practices, performance-optimization]
  MST-022: [frontend-ui-engineering, fixing-accessibility]
  MST-023: [test-driven-development, documentation-and-adrs]
  MST-030: [api-and-interface-design, workers-best-practices, observability-and-instrumentation]
  MST-031: [agents-sdk, test-driven-development, security-and-hardening]
  MST-032: [frontend-ui-engineering, fixing-accessibility]
  MST-040: [frontend-ui-engineering, fixing-accessibility]
  MST-041: [api-and-interface-design, workers-best-practices, test-driven-development]
  MST-042: [frontend-ui-engineering, fixing-metadata, web-perf]
  MST-050: [seo-audit, fixing-metadata, workers-best-practices]
  MST-051: [frontend-ui-engineering, fixing-accessibility, fixing-metadata]
  MST-052: [seo-audit, test-driven-development]
  MST-060: [workers-best-practices, observability-and-instrumentation, performance-optimization]
  MST-061: [workers-best-practices, performance-optimization, test-driven-development]
  MST-062: [frontend-ui-engineering, fixing-accessibility, web-perf]
  MST-063: [test-driven-development, documentation-and-adrs, shipping-and-launch]
