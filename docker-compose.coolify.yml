version: "3.8"

services:
  # -------------------------------------------------------------
  # MStudio Web Portal & CMS Service
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mstudio-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Hybrid Setup: Giữ R2 trên Cloudflare cho media (0đ egress)
      - CLOUDFLARE_R2_BUCKET=${CLOUDFLARE_R2_BUCKET:-mstudio-raw}
      - CLOUDFLARE_R2_ACCOUNT_ID=${CLOUDFLARE_R2_ACCOUNT_ID}
      - CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID}
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      # Cloudflare Workers AI Endpoint (Offload LLM tasks)
      - CF_AI_GATEWAY_URL=${CF_AI_GATEWAY_URL}
      - CF_AI_API_TOKEN=${CF_AI_API_TOKEN}
      # Local Database (SQLite WAL on fast NVMe)
      - DATABASE_URL=file:/data/mstudio.db
    volumes:
      - mstudio_data:/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.2"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/hello"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # -------------------------------------------------------------
  # Cloudflare Tunnel Client (Khuyên dùng để giấu IP thật của NAS)
  # -------------------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: mstudio-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

volumes:
  mstudio_data:
    driver: local
