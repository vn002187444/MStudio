<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <style>
      :root {
        --m-primary: #2563EB;
        --m-secondary: #06B6D4;
        --m-bg: #07080B;
        --m-stroke: rgba(255, 255, 255, 0.3);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --m-primary: #1D4ED8;
          --m-secondary: #0284C7;
          --m-bg: #FFFFFF;
          --m-stroke: rgba(0, 0, 0, 0.15);
        }
      }
    </style>
    <linearGradient id="fav-squircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E40AF" />
      <stop offset="50%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#0B132B" />
    </linearGradient>
    <linearGradient id="fav-facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#93C5FD" />
      <stop offset="100%" stopColor="#3B82F6" />
    </linearGradient>
    <linearGradient id="fav-facet-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#60A5FA" />
      <stop offset="100%" stopColor="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Squircle Chassis with Specular Rim -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#fav-squircle)" stroke="var(--m-stroke)" stroke-width="3" />

  <!-- Geometric Sapphire Facets of M -->
  <path d="M22 76 V28 L40 46 V76 Z" fill="url(#fav-facet-left)" />
  <path d="M40 46 L50 36 L60 46 L50 62 Z" fill="#FFFFFF" fill-opacity="0.95" />
  <path d="M78 76 V28 L60 46 V76 Z" fill="url(#fav-facet-right)" />

  <!-- Core Precision Path -->
  <path d="M22 76 L22 26 L50 56 L78 26 L78 76" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
